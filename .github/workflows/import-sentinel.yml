name: Import Sentinel Desk project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-project:
    if: "contains(github.event.head_commit.message, '[sentinel-import-stage]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Sentinel Desk source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk*.b64 | base64 --decode > /tmp/sentinel-desk.tar.xz
          rm -rf /tmp/sentinel-extract
          mkdir -p /tmp/sentinel-extract
          tar -xJf /tmp/sentinel-desk.tar.xz -C /tmp/sentinel-extract
          src="/tmp/sentinel-extract/Sentinel-Desk-Final-v3"
          test -d "$src"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .

      - name: Recreate package lock
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - shell: bash
        run: npm install --package-lock-only --ignore-scripts --engine-strict=false

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace SOC L1 lab with Sentinel Desk Final v3"
          git push origin HEAD:main
